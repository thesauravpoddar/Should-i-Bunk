services:
  postgres:
    container_name: Should-i-Bunk-application
    image: postgres
    environment:
      PGDATA: /var/lib/postgresql/data
    env_file:
      - ./credentials.env
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5556:5432
    networks:
      - shouldibunk-network
    restart: unless-stopped

volumes:
  postgres:
    driver: local

networks:
  shouldibunk-network:
    driver: bridge
